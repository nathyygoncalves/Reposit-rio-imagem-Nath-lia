<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teachable Machine - Classificador</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0d6efd, #6610f2);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            border-radius: 20px;
            padding: 20px;
            background: #ffffff;
            color: #333;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        #webcam-container canvas {
            border-radius: 15px;
            border: 3px solid #0d6efd;
            width: 100%;
            max-width: 300px;
        }

        .btn-start {
            background: linear-gradient(45deg, #0d6efd, #6610f2);
            border: none;
            color: white;
            font-weight: bold;
            padding: 12px 20px;
            border-radius: 50px;
            transition: 0.3s;
        }

        .btn-start:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .progress {
            height: 20px;
            border-radius: 10px;
            background-color: #e9ecef;
        }

        .progress-bar {
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card text-center mx-auto" style="max-width: 500px;">
        <h3 class="mb-3">🤖 Classificador de Imagens</h3>

        <button class="btn btn-start mb-4" onclick="init()">
            📷 Ativar Câmera
        </button>

        <div id="webcam-container" class="mb-4 d-flex justify-content-center"></div>

        <div id="label-container"></div>
    </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

<script>
    const URL = "./my_model/";

    let model, webcam, labelContainer, maxPredictions;

    async function init() {
        const modelURL = URL + "model.json";
        const metadataURL = URL + "metadata.json";

        model = await tmImage.load(modelURL, metadataURL);
        maxPredictions = model.getTotalClasses();

        const flip = true;
        webcam = new tmImage.Webcam(300, 300, flip);
        await webcam.setup();
        await webcam.play();
        window.requestAnimationFrame(loop);

        document.getElementById("webcam-container").innerHTML = "";
        document.getElementById("webcam-container").appendChild(webcam.canvas);

        labelContainer = document.getElementById("label-container");
        labelContainer.innerHTML = "";

        for (let i = 0; i < maxPredictions; i++) {
            const div = document.createElement("div");
            div.classList.add("mb-3");

            div.innerHTML = `
                <div class="d-flex justify-content-between">
                    <span id="label-${i}">Classe</span>
                    <span id="value-${i}">0%</span>
                </div>
                <div class="progress">
                    <div id="bar-${i}" class="progress-bar bg-primary" style="width: 0%">0%</div>
                </div>
            `;

            labelContainer.appendChild(div);
        }
    }

    async function loop() {
        webcam.update();
        await predict();
        window.requestAnimationFrame(loop);
    }

    async function predict() {
        const prediction = await model.predict(webcam.canvas);

        for (let i = 0; i < maxPredictions; i++) {
            const prob = prediction[i].probability;
            const percent = (prob * 100).toFixed(1);

            document.getElementById(`label-${i}`).innerText = prediction[i].className;
            document.getElementById(`value-${i}`).innerText = percent + "%";

            const bar = document.getElementById(`bar-${i}`);
            bar.style.width = percent + "%";
            bar.innerText = percent + "%";
        }
    }
</script>

</body>
</html>
